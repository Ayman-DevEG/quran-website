<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="icon" href="./قران.jpg" type="image/png">
    <title>المصحف الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <header>
            <h1>المصحف الإلكتروني</h1>
            <p>استمع وحمّل السور والآيات بصوت كبار القراء</p>
        </header>

        <div class="selection-box">
            <div class="input-group">
                <label for="reciterInput">اكتب أو اختر اسم القارئ:</label>
                <input type="text" id="reciterInput" list="recitersDataList" placeholder="مثال: عبد الباسط عبد الصمد...">
                <datalist id="recitersDataList">
                    </datalist>
            </div>

            <div class="input-group">
                <label for="surahSelect">اختر السورة:</label>
                <select id="surahSelect" disabled>
                    <option value="">-- اختر القارئ أولاً --</option>
                </select>
            </div>
        </div>

        <div id="playerContainer" class="player-container hidden">
            <h3 id="playingTitle">اسم السورة - اسم القارئ</h3>
            
            <audio id="audioPlayer" controls>
                متصفحك لا يدعم مشغل الصوت.
            </audio>

            <div class="action-buttons">
                <a id="downloadBtn" href="#" download class="btn-download">
                    تحميل السورة (MP3)
                </a>
            </div>
        </div>
        
        <div class="footer-credit">
            تم التطوير بكل فخر بواسطة 
            <a href="https://wa.me/201206473107" target="_blank" class="dev-link">أيمن عبد الغفار</a>
        </div>

    </div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered'))
                    .catch(err => console.log('Service Worker Error', err));
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
